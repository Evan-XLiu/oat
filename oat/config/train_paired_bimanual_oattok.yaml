defaults:
  - _self_
  - task/tokenizer: bimanual/default

name: train_paired_bimanual_oattok
_target_: oat.workspace.train_oattok.TrainOATTokWorkspace

seed: 42
horizon: 32
token_horizon: 8
task_name: ${task.tokenizer.name}
arm_dim: 7
action_dim: ${task.tokenizer.shape_meta.action.shape[0]}
right_arm_sign: [-1, 1, 1, 1, -1, -1, 1]

common_levels: [8, 5]
relative_levels: [5, 5]
common_latent_dim: ${eval:'len(${common_levels})'}
relative_latent_dim: ${eval:'len(${relative_levels})'}

tokenizer:
  _target_: oat.tokenizer.bimanual_oat.paired_tokenizer.PairedBimanualOATTok
  right_arm_sign: ${right_arm_sign}

  encoder:
    _target_: oat.tokenizer.bimanual_oat.paired_encoder.PairedRegisterEncoder
    arm_dim: ${arm_dim}
    sample_horizon: ${horizon}
    emb_dim: 256
    head_dim: 64
    depth: 2
    pdropout: 0.1
    common_latent_dim: ${common_latent_dim}
    relative_latent_dim: ${relative_latent_dim}
    num_registers: ${token_horizon}

  decoder:
    _target_: oat.tokenizer.bimanual_oat.paired_decoder.PairedSinglePassDecoder
    arm_dim: ${arm_dim}
    sample_horizon: ${horizon}
    emb_dim: 256
    head_dim: 64
    depth: 4
    pdropout: 0.1
    token_dropout_mode: pow2
    use_causal_decoder: true
    common_latent_dim: ${common_latent_dim}
    relative_latent_dim: ${relative_latent_dim}
    latent_horizon: ${token_horizon}

  quantizer:
    _target_: oat.tokenizer.bimanual_oat.paired_quantizer.PairedFSQ
    common_quantizer:
      _target_: oat.tokenizer.oat.quantizer.fsq.FSQ
      levels: ${common_levels}
    relative_quantizer:
      _target_: oat.tokenizer.oat.quantizer.fsq.FSQ
      levels: ${relative_levels}

training:
  resume: true
  allow_bf16: true
  max_grad_norm: 1.0
  num_epochs: 5001
  checkpoint_every: 10
  val_every: 10
  sample_every: 10
  lr_scheduler: constant
  lr_warmup_steps: 100
  gradient_accumulate_every: 1
  max_train_steps: null
  max_val_steps: null
  max_reconst_steps: null
  seed: ${seed}
  use_ema: true
  num_demo: 500
  tqdm_interval_sec: 1.0

ema:
  _target_: oat.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  learning_rate: 5.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.95]

dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: true
  drop_last: true

val_dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: false
  pin_memory: true
  persistent_workers: true
  drop_last: true

logging:
  project: oat_dev
  resume: true
  mode: online
  name: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_K${token_horizon}_N${training.num_demo}
  tags: ["${name}", "${task_name}", "K${token_horizon}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_reconst_mse
    mode: min
    k: 3
    format_str: ep-{epoch:04d}_mse-{test_reconst_mse:.3f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false

multi_run:
  run_dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_K${token_horizon}_N${training.num_demo}
  wandb_name_base: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_K${token_horizon}_N${training.num_demo}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_K${token_horizon}_N${training.num_demo}
  sweep:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_K${token_horizon}_N${training.num_demo}
    subdir: ${hydra.job.num}
